<div class="field-block{% if field.errors %} has-errors{% endif %} field-{{ field.name }}">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
        {% if nota %}<small class="field-label-note">{{ nota }}</small>{% endif %}
    </label>

    {{ field }}

    <div class="field-help" id="ayuda-{{ field.name }}">{{ ayuda|default:"" }}</div>

    {% if field.errors %}
        <div class="field-error">{{ field.errors|striptags }}</div>
    {% endif %}
</div>
