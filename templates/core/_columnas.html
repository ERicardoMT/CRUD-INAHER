{# Ocultar columnas (static/js/tablas.js): la casilla marcada esconde su columna al momento. #}
<div class="columnas-control" data-columnas-de="{{ tabla }}">
    <div class="dropdown">
        <button class="btn btn-outline-inaher btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"
                data-bs-auto-close="outside" aria-expanded="false">
            <i class="bi bi-layout-three-columns"></i> Columnas <span data-columnas-cuantas></span>
        </button>
        <div class="dropdown-menu shadow-sm columnas-lista">
            <label class="dropdown-item d-flex align-items-center gap-2 fw-semibold">
                <input type="checkbox" class="form-check-input mt-0" data-columnas-todas> Seleccionar todo
            </label>
            <div class="dropdown-divider"></div>
            <div data-columnas-lista></div>
        </div>
    </div>
</div>
